<!DOCTYPE html>
<html>
<head>
  <title>Lesson 13b</title>

  <style>
    .layout {
      display: flex;
      height: 50px;
    }

    .left {
      width: 100px;
      background-color: lightpink;
    }

    .right {
      width: 200px;
      background-color: lightblue;
      padding-left: 10px;
    }

    .bottom-row {
      display: flex;
      justify-content: space-between;
    }

    .box {
      background-color: black;
      color: white;
    }
  </style>
</head>

<body>

  <div class="layout">

    <div class="left"></div>

    <div class="right">

      <div>row1</div>

      <div class="bottom-row">
        <div class="box">row2</div>
        <div class="box">row2</div>
      </div>

    </div>

  </div>

</body>
</html>
