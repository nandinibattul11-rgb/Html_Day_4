<!DOCTYPE html>
<html>
<head>
  <title>Lesson 13g</title>

  <style>
    body {
      font-family: Arial;
    }

    .post {
      display: flex;
      width: 420px;
      margin: 20px;
    }

    .profile-area {
      margin-right: 10px;
    }

    .profile {
      width: 50px;
      height: 50px;
      border-radius: 25px;
      object-fit: cover;
    }

    .post-content {
      flex: 1;
    }

    .user-info {
      display: flex;
      margin-bottom: 6px;
    }

    .username {
      font-weight: bold;
      margin-right: 6px;
    }

    .handle {
      color: gray;
    }

    .message {
      line-height: 20px;
      margin-bottom: 15px;
    }

    .video {
      display: flex;
      border: 1px solid rgb(210, 210, 210);
      border-radius: 15px;
      overflow: hidden;
    }

    .video-picture {
      width: 100px;
      height: 100px;
      background-color: rgb(220, 220, 220);
    }

    .video-details {
      padding: 12px;
    }

    .website {
      color: gray;
      margin-bottom: 5px;
    }

    .video-name {
      line-height: 20px;
    }
  </style>
</head>

<body>

  <div class="post">

    <div class="profile-area">
      <img class="profile" src="sec_cat.jpg">
    </div>

    <div class="post-content">

      <div class="user-info">
        <div class="username">supersimple.dev</div>
        <div class="handle">@SuperSimpleDev</div>
      </div>

      <div class="message">
        What is backend web development? A complete overview.
        New video is up!
      </div>

      <div class="video">

        <div class="video-picture"></div>

        <div class="video-details">
          <div class="website">youtube.com</div>

          <div class="video-name">
            Backend web development - a complete overview (2021)
          </div>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
