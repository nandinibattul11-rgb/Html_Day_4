<!DOCTYPE html>
<html>
<head>
  <title>Lesson 13d</title>

  <style>
    body {
      font-family: Arial;
    }

    .inbox {
      width: 400px;
      padding: 15px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.25);
    }

    .heading {
      color: gray;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .mail {
      display: flex;
      align-items: center;
    }

    .photo {
      width: 50px;
      height: 50px;
      border-radius: 25px;
      object-fit: cover;
      margin-right: 10px;
    }

    .details {
      flex: 1;
    }

    .top-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .person {
      font-size: 18px;
      font-weight: bold;
    }

    .time {
      color: gray;
      font-size: 14px;
    }

    .subject {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .text {
      color: gray;
    }
  </style>
</head>

<body>

  <div class="inbox">

    <div class="heading">
      ALL INBOXES
    </div>

    <div class="mail">

      <img class="photo" src="first_cat.jpg">

      <div class="details">

        <div class="top-line">
          <div class="person">Chewy Promotions</div>
          <div class="time">4:58 PM</div>
        </div>

        <div class="subject">
          Biggest sales of the year!
        </div>

        <div class="text">
          Hey there! We're writing to tell you about our...
        </div>

      </div>

    </div>

  </div>

</body>
</html>
