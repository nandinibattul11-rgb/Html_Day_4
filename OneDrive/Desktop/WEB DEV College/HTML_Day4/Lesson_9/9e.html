<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Circle</title>
</head>
<style>
    .cat {
        height: 100px;
        width: 100px;
        border-radius: 120px;
        display: inline-block;
        vertical-align: middle;
        margin-left: 4px;
    }
    .t1 {
        display: inline-block;
        vertical-align: middle;
        margin-left: 10px;
    }
    button {
        background-color: #1E90FF;
        color: white;
        font-weight: bold;
        border-radius: 30px;
        border: none;
        height: 30px;
        width: 75px;
        margin-left: 250px;
    }
    .div-example {
        height: 100px;
        width: 600px;
        border: 1px solid black;
        border-radius: 4px;
        box-shadow: 2px 2px 2px black;
    }
</style>
<body>
    <div class="div-example">
    <img  class="cat" src="cat.jpg"></img>
    <p class="t1"> What's happening? </p>
    <button> Tweet </button>
    </div>
</body>
</html>
