<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
</head>
<style>
    div {
        display: inline-block;
    }
    img {
        height: 150px;
        width: 150px;
        display: inline-block;
    }
    
    p {
        display: block;
        margin-left: 10px;
        margin-top: 3px;
        font-weight: bold;
    }
    h5 {
        color: grey;
        margin-left 5px;
    }
    button {
        background-color: #1E90FF;
        color: white;
        margin-top: 2px;
        height: 36px;
        width: 120px;
        margin-bottom: 4px;
        margin-left: 3px;
    }
   .div1,.div2,.div3 {
    border: 1px solid black;
    border-radius: 2px;
    margin-left: 5px;
    box-shadow: 2px 2px 2px grey;
   }
</style>
<body>
    <div>
        <div class="div1">
        <img src="rose.jpg"></img>
        <p> Rose </p>
        <h5> 2 mutual Friends </h5>
        <button> Add Friend </button>
        </div>
        <div class="div2">
        <img src="sunflower.jpg"> </img>
        <p> Sunflower </p>
        <h5> 3 mutual Friends </h5>
        <button> Add Friend </button>
        </div>
        <div class="div3">
        <img src="lily.jpg"> </img>
        <p> Lily </p>
        <h5> 2 mutual Friends </h5>
        <button> Add Friend </button>
        </div>
    </div>

    
</body>
</html>
