<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11c</title>
</head>
<style>
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  column-gap: 20px;
  row-gap: 10px;
}
.pink {
  background-color: pink;
}
</style>
<body>
<div class="grid">
      
    <div class="pink">col1</div>
    <div class="pink">col2</div>
    <div class="pink">col3</div>
    <div class="pink">col4</div>
    <div class="pink">col5</div>
    <div class="pink">col6</div>
    <div class="pink">col7</div>
    <div class="pink">col8</div>
      
    
</body>
</html>
